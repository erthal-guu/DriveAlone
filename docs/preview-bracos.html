<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia dos braços</title>
<style>
 html,body{margin:0;height:100%;background:#15191b;color:#e9eee6;font:13px 'Segoe UI',system-ui,sans-serif;overflow:hidden}
 canvas{display:block;width:100vw;height:100vh}
 .label{position:fixed;padding:6px 10px;background:#0d1112cc;border-radius:6px;font-weight:600;letter-spacing:.2px}
 .bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px}
 .bar a{color:#e9eee6;background:#24302f;padding:8px 14px;border-radius:8px;text-decoration:none}
 .bar a.on{background:#dfe9cf;color:#20332a}
</style>
</head>
<body>
<div class="label" style="left:12px;top:10px">Primeira pessoa</div>
<div class="label" style="left:calc(50% + 12px);top:10px">Três quartos</div>
<div class="label" style="left:12px;top:calc(50% + 10px)">Detalhe da mão</div>
<div class="label" style="left:calc(50% + 12px);top:calc(50% + 10px)">Volante girado 70°</div>
<div class="bar"><a href="?estilo=luva" id="luva">Luva</a><a href="?estilo=pele" id="pele">Pele</a></div>
<script src="../vendor/three.min.js"></script>
<script src="../fp-arms.js"></script>
<script>
// Prévia do modelo de braços de primeira pessoa (fp-arms.js) segurando um volante de referência genérico.
// O volante daqui é só o molde do encaixe: no jogo, cada carro terá o seu.
const T=THREE,style=new URLSearchParams(location.search).get('estilo')==='pele'?'pele':'luva';document.getElementById(style).classList.add('on');
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.setScissorTest(true);document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#7d8b92');
scene.add(new T.HemisphereLight('#dfe8f0','#3b3631',1.4));const sun=new T.DirectionalLight('#fff3df',2.6);sun.position.set(1.5,3,1.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=sun.shadow.camera.bottom=-1.2;sun.shadow.camera.right=sun.shadow.camera.top=1.2;scene.add(sun);
const floor=new T.Mesh(new T.CircleGeometry(3,64),new T.MeshStandardMaterial({color:'#566166',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// Reference wheel: rim, three spokes and hub, tilted like a car's column.
const center=new T.Vector3(0,.9,.25),axis=new T.Vector3(0,.33,.94).normalize(),radius=.18,tube=.017;
function referenceWheel(){const g=new T.Group(),rubber=new T.MeshStandardMaterial({color:'#1b1d20',roughness:.5}),metal=new T.MeshStandardMaterial({color:'#7f878c',metalness:.7,roughness:.35});
 const rim=new T.Mesh(new T.TorusGeometry(radius,tube,20,96),rubber);g.add(rim);const hub=new T.Mesh(new T.CylinderGeometry(.055,.06,.05,32),rubber);hub.rotation.x=Math.PI/2;g.add(hub);
 for(const a of [0,Math.PI,-Math.PI/2]){const spoke=new T.Mesh(new T.BoxGeometry(.13,.028,.014),metal);spoke.position.set(Math.cos(a)*.1,Math.sin(a)*.1,0);spoke.rotation.z=a;g.add(spoke);}
 g.traverse(o=>{if(o.isMesh)o.castShadow=true;});return g;}
const eye=new T.Vector3(0,center.y+.27,center.z-.55);
function rig(angle,x){const holder=new T.Group();holder.position.x=x;scene.add(holder);const wheel=referenceWheel();wheel.position.copy(center);wheel.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),axis);wheel.rotateZ(angle);holder.add(wheel);
 const arms=new FirstPersonArms({style});arms.pose(eye,{center,axis,radius,tube,angle});holder.add(arms.group);return holder;}
rig(0,0);rig(-70*Math.PI/180,6);
const views=[
 {cam:new T.PerspectiveCamera(68,1,.02,50),from:[eye.x,eye.y,eye.z],to:[0,eye.y-Math.tan(4.5*Math.PI/180)*10,eye.z+10]},
 {cam:new T.PerspectiveCamera(40,1,.02,50),from:[1.25,1.45,-.95],to:[0,.92,-.05]},
 {cam:new T.PerspectiveCamera(32,1,.02,50),from:[.55,1.05,-.05],to:[.17,.93,.22]},
 {cam:new T.PerspectiveCamera(68,1,.02,50),from:[6+eye.x,eye.y,eye.z],to:[6,eye.y-Math.tan(4.5*Math.PI/180)*10,eye.z+10]}];
function draw(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
 views.forEach((v,i)=>{const x=(i%2)*w/2,y=(i<2?h/2:0);renderer.setViewport(x,y,w/2,h/2);renderer.setScissor(x,y,w/2,h/2);v.cam.aspect=(w/2)/(h/2);v.cam.updateProjectionMatrix();v.cam.position.set(...v.from);v.cam.lookAt(...v.to);renderer.render(scene,v.cam);});}
addEventListener('resize',draw);draw();
</script>
</body>
</html>
